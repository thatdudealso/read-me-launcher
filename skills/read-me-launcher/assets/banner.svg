<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-label="read-me-launcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#0b1220;#020617" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="orb" cx="82%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { fill: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 72px; font-weight: 780; letter-spacing: -2px; }
      .sub { fill: #cbd5e1; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 26px; font-weight: 500; }
      .kicker { fill: #99f6e4; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; letter-spacing: 3px; }
      .chip { fill: rgba(15,23,42,0.85); stroke: #2dd4bf; stroke-opacity: 0.5; }
      .chip-t { fill: #ccfbf1; font-family: ui-monospace, Menlo, monospace; font-size: 16px; }
      .beam { opacity: 0.85; }
      @media (prefers-color-scheme: light) {
        .title { fill: #0f172a; }
        .sub { fill: #334155; }
        .kicker { fill: #0f766e; }
        .chip { fill: #ffffff; stroke: #0f766e; }
        .chip-t { fill: #0f766e; }
      }
    </style>
  </defs>
  <rect width="1440" height="480" fill="url(#bg)"/>
  <rect width="1440" height="480" fill="url(#grid)"/>
  <rect width="1440" height="480" fill="url(#orb)"/>
  <circle cx="1180" cy="90" r="160" fill="#22d3ee" fill-opacity="0.08">
    <animate attributeName="cy" values="90;110;90" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="390" r="130" fill="#2dd4bf" fill-opacity="0.08">
    <animate attributeName="cx" values="220;250;220" dur="10s" repeatCount="indefinite"/>
  </circle>
  <rect class="beam" x="88" y="128" width="10" height="84" rx="5" fill="url(#accent)" filter="url(#glow)"/>
  <text class="kicker" x="120" y="120">AGENT SKILL · README CRAFT</text>
  <text class="title" x="120" y="190">read-me-launcher</text>
  <text class="sub" x="120" y="245">Front doors so good developers stop scrolling.</text>
  <rect class="chip" x="120" y="292" width="360" height="44" rx="22"/>
  <text class="chip-t" x="148" y="320">local SVG craft · secret-safe · gh skill</text>
  <rect x="0" y="470" width="1440" height="10" fill="url(#accent)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
