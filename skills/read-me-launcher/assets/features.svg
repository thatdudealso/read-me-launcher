<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="260" viewBox="0 0 1180 260" role="img" aria-label="capabilities">
  <defs>
    <style>
      .bg { fill: transparent; }
      .card { fill: #0b1220; stroke: #334155; }
      .n { fill: #2dd4bf; font-family: ui-monospace, Menlo, monospace; font-size: 13px; letter-spacing: 2px; }
      .t { fill: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 22px; font-weight: 720; }
      .d { fill: #94a3b8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; }
      @media (prefers-color-scheme: light) {
        .card { fill: #ffffff; stroke: #cbd5e1; }
        .n { fill: #0f766e; }
        .t { fill: #0f172a; }
        .d { fill: #475569; }
      }
    </style>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="1180" height="260"/>
  <rect class="card" x="0" y="20" width="370" height="220" rx="18"/>
  <rect x="0" y="20" width="370" height="5" rx="2" fill="url(#edge)"/>
  <text class="n" x="28" y="70">01</text>
  <text class="t" x="28" y="110">Stop the scroll</text>
  <text class="d" x="28" y="145">Hero + preview that feel</text>
  <text class="d" x="28" y="168">like a product launch,</text>
  <text class="d" x="28" y="191">not a template dump.</text>

  <rect class="card" x="405" y="20" width="370" height="220" rx="18"/>
  <rect x="405" y="20" width="370" height="5" rx="2" fill="url(#edge)"/>
  <text class="n" x="433" y="70">02</text>
  <text class="t" x="433" y="110">Render without drama</text>
  <text class="d" x="433" y="145">No nested fences in divs.</text>
  <text class="d" x="433" y="168">Local SVG motion. Lint</text>
  <text class="d" x="433" y="191">before the page ships.</text>

  <rect class="card" x="810" y="20" width="370" height="220" rx="18"/>
  <rect x="810" y="20" width="370" height="5" rx="2" fill="url(#edge)"/>
  <text class="n" x="838" y="70">03</text>
  <text class="t" x="838" y="110">Safe by default</text>
  <text class="d" x="838" y="145">Public vs private voice.</text>
  <text class="d" x="838" y="168">Credential deny-list. Real</text>
  <text class="d" x="838" y="191">commands only.</text>
</svg>
