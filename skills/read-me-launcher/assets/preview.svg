<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-label="README craft preview">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <style>
      .panel { fill: #0b1220; stroke: #334155; }
      .titlebar { fill: #020617; }
      .h1 { fill: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 36px; font-weight: 750; }
      .pitch { fill: #94a3b8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 18px; }
      .label { fill: #2dd4bf; font-family: ui-monospace, Menlo, monospace; font-size: 13px; letter-spacing: 2px; }
      .body { fill: #cbd5e1; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; }
      .codebg { fill: #020617; stroke: #1e293b; }
      .code { fill: #e2e8f0; font-family: ui-monospace, Menlo, monospace; font-size: 16px; }
      .prompt { fill: #2dd4bf; }
      .muted { fill: #64748b; }
      .card { fill: #111827; stroke: #334155; }
      .card-t { fill: #f1f5f9; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 700; }
      .card-d { fill: #94a3b8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; }
      .line { opacity: 0; }
      .l1 { animation: in 5s infinite; }
      .l2 { animation: in 5s infinite 0.35s; }
      .l3 { animation: in 5s infinite 0.7s; }
      @keyframes in {
        0%, 8% { opacity: 0; transform: translateY(6px); }
        18%, 80% { opacity: 1; transform: translateY(0); }
        92%, 100% { opacity: 0; }
      }
      @media (prefers-color-scheme: light) {
        .panel { fill: #ffffff; stroke: #cbd5e1; }
        .titlebar { fill: #f1f5f9; }
        .h1 { fill: #0f172a; }
        .pitch { fill: #475569; }
        .body { fill: #334155; }
        .codebg { fill: #0f172a; }
        .card { fill: #f8fafc; stroke: #cbd5e1; }
        .card-t { fill: #0f172a; }
        .card-d { fill: #64748b; }
      }
    </style>
  </defs>
  <rect width="1180" height="620" fill="url(#desk)"/>
  <rect x="70" y="40" width="1040" height="540" rx="20" class="panel" filter="url(#soft)"/>
  <rect x="70" y="40" width="1040" height="48" rx="20" class="titlebar"/>
  <rect x="70" y="68" width="1040" height="20" class="titlebar"/>
  <circle cx="102" cy="64" r="7" fill="#f87171"/>
  <circle cx="126" cy="64" r="7" fill="#fbbf24"/>
  <circle cx="150" cy="64" r="7" fill="#34d399"/>
  <text class="muted" x="180" y="69" font-family="ui-monospace, Menlo, monospace" font-size="13">README.md — product front door</text>
  <rect x="70" y="88" width="1040" height="4" fill="url(#bar)"/>

  <text class="label" x="110" y="140">LAUNCHED BY READ-ME-LAUNCHER</text>
  <text class="h1 line l1" x="110" y="188">Ship a front door people trust</text>
  <text class="pitch line l2" x="110" y="226">Hero. Pitch. Real install. Zero credential leaks.</text>

  <rect class="codebg" x="110" y="258" width="960" height="88" rx="14"/>
  <text class="code line l3" x="134" y="294"><tspan class="prompt">$</tspan> gh skill install thatdudealso/read-me-launcher</text>
  <text class="code muted" x="134" y="322"># ask: launch a stunning README for this repo</text>

  <rect class="card" x="110" y="380" width="300" height="120" rx="14"/>
  <text class="card-t" x="132" y="424">Visual craft</text>
  <text class="card-d" x="132" y="452">Theme-aware SVG heroes</text>
  <text class="card-d" x="132" y="474">Local motion, no flaky hosts</text>

  <rect class="card" x="430" y="380" width="300" height="120" rx="14"/>
  <text class="card-t" x="452" y="424">Truth first</text>
  <text class="card-d" x="452" y="452">Inspects the real tree</text>
  <text class="card-d" x="452" y="474">Commands match reality</text>

  <rect class="card" x="750" y="380" width="320" height="120" rx="14"/>
  <text class="card-t" x="772" y="424">Safe to publish</text>
  <text class="card-d" x="772" y="452">Credential deny-list</text>
  <text class="card-d" x="772" y="474">Render lint before ship</text>
</svg>
