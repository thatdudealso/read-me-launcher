<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-label="README preview window">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .win { fill: url(#frame); stroke: #334155; }
      .titlebar { fill: #0b1220; }
      .dot-r { fill: #f87171; } .dot-y { fill: #fbbf24; } .dot-g { fill: #34d399; }
      .h1 { fill: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 34px; font-weight: 700; }
      .pitch { fill: #94a3b8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 18px; }
      .label { fill: #2dd4bf; font-family: ui-monospace, Menlo, monospace; font-size: 14px; letter-spacing: 1px; }
      .body { fill: #cbd5e1; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; }
      .codebg { fill: #020617; stroke: #1e293b; }
      .code { fill: #e2e8f0; font-family: ui-monospace, Menlo, monospace; font-size: 15px; }
      .prompt { fill: #2dd4bf; }
      .muted { fill: #64748b; }
      @media (prefers-color-scheme: light) {
        .win { fill: #ffffff; stroke: #cbd5e1; }
        .titlebar { fill: #f1f5f9; }
        .h1 { fill: #0f172a; }
        .pitch { fill: #475569; }
        .body { fill: #334155; }
        .codebg { fill: #0f172a; stroke: #334155; }
        .muted { fill: #94a3b8; }
      }
    </style>
  </defs>
  <rect width="1080" height="560" fill="#020617"/>
  <rect x="70" y="48" width="940" height="464" rx="18" class="win" filter="url(#soft)"/>
  <rect x="70" y="48" width="940" height="44" rx="18" class="titlebar"/>
  <rect x="70" y="74" width="940" height="18" class="titlebar"/>
  <circle cx="100" cy="70" r="7" class="dot-r"/>
  <circle cx="124" cy="70" r="7" class="dot-y"/>
  <circle cx="148" cy="70" r="7" class="dot-g"/>
  <text class="muted" x="180" y="75" font-family="ui-monospace, Menlo, monospace" font-size="13">README.md  your-repo</text>
  <rect x="70" y="92" width="940" height="4" fill="url(#bar)"/>
  <text class="label" x="110" y="150">PRODUCT README</text>
  <text class="h1" x="110" y="198">Ship a front door people trust</text>
  <text class="pitch" x="110" y="236">One screen. Clear pitch. Real install path. No secret leaks.</text>
  <rect class="codebg" x="110" y="270" width="860" height="96" rx="12"/>
  <text class="code" x="134" y="308"><tspan class="prompt">$</tspan> gh skill install thatdudealso/read-me-launcher</text>
  <text class="code muted" x="134" y="338"># then ask your agent: launch a polished README for this repo</text>
  <text class="body" x="110" y="420">Public voice for outsiders. Private voice for teammates. Visual craft on purpose.</text>
  <text class="body" x="110" y="448">Hero graphics · tight rhythm · deny-list for credentials · Agent Skills ready</text>
</svg>
