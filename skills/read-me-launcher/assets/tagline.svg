<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56" role="img" aria-label="tagline">
  <defs>
    <style>
      .line {
        fill: #2dd4bf;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 22px;
        font-weight: 650;
      }
      .a { opacity: 0; animation: showA 7s infinite; }
      .b { opacity: 0; animation: showB 7s infinite; }
      @keyframes showA {
        0%, 8% { opacity: 0; }
        14%, 46% { opacity: 1; }
        54%, 100% { opacity: 0; }
      }
      @keyframes showB {
        0%, 54% { opacity: 0; }
        60%, 92% { opacity: 1; }
        100% { opacity: 0; }
      }
      @media (prefers-color-scheme: light) {
        .line { fill: #0f766e; }
      }
    </style>
  </defs>
  <rect width="900" height="56" fill="transparent"/>
  <text class="line a" x="450" y="36" text-anchor="middle">READMEs that feel owned.</text>
  <text class="line b" x="450" y="36" text-anchor="middle">Not scaffolds. Not secrets. Not slop.</text>
</svg>
